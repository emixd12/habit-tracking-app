name: Public Trust evidence

on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected Actions environment
        type: choice
        options: [preview, production]
        default: preview
      source_commit:
        description: Expected 40-character source commit
        required: true
        type: string
      application_deployment_id:
        description: Named Ready application deployment ID
        required: true
        type: string
      application_deployment_url:
        description: Public application deployment URL
        required: true
        type: string
      marketing_deployment_id:
        description: Named Ready marketing deployment ID
        required: true
        type: string
      marketing_deployment_url:
        description: Public marketing deployment URL
        required: true
        type: string
      run_rls:
        description: Run the authorized disposable-user RLS smoke
        type: boolean
        default: false
  schedule:
    - cron: "17 7 * * *"

permissions: {}

concurrency:
  group: public-trust-evidence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: public-trust-${{ inputs.target || 'production' }}
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Checkout named source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Build deterministic marketing artifacts
        env:
          MARKETING_SITE_URL: ${{ vars.MARKETING_PRODUCTION_ORIGIN }}
          PUBLIC_CADENCE_APP_URL: ${{ vars.APPLICATION_PRODUCTION_ORIGIN }}
        run: npm run marketing:build
      - name: Prepare bounded collection input
        env:
          TRUST_SOURCE_COMMIT: ${{ inputs.source_commit }}
          TRUST_APPLICATION_DEPLOYMENT_ID: ${{ inputs.application_deployment_id }}
          TRUST_APPLICATION_DEPLOYMENT_URL: ${{ inputs.application_deployment_url }}
          TRUST_MARKETING_DEPLOYMENT_ID: ${{ inputs.marketing_deployment_id }}
          TRUST_MARKETING_DEPLOYMENT_URL: ${{ inputs.marketing_deployment_url }}
          TRUST_PAGES_ORIGIN: ${{ vars.TRUST_PAGES_ORIGIN }}
          VERCEL_APPLICATION_PROJECT_ID: ${{ vars.VERCEL_APPLICATION_PROJECT_ID }}
          VERCEL_MARKETING_PROJECT_ID: ${{ vars.VERCEL_MARKETING_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TRUST_TARGET: ${{ inputs.target || 'production' }}
        run: node scripts/prepare-public-trust-input.mjs --output .trust-input.json
      - name: Collect sanitized evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_RLS: ${{ inputs.run_rls || 'false' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          VERCEL_APPLICATION_PROJECT_ID: ${{ vars.VERCEL_APPLICATION_PROJECT_ID }}
          VERCEL_MARKETING_PROJECT_ID: ${{ vars.VERCEL_MARKETING_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          PUBLIC_TRUST_INPUT="$(<.trust-input.json)" npm run --silent public-trust:collect -- --output snapshot.json --details-output details.json
          code=$?
          echo "$code" > collector-exit
          exit 0
      - name: Validate schema and sanitization before staging
        run: npm run public-trust:validate -- snapshot.json details.json
      - name: Upload validated collection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-trust-collection
          path: |
            snapshot.json
            details.json
            collector-exit
          if-no-files-found: error
          retention-days: 30
      - name: Fail Preview gate after retaining validated evidence
        if: inputs.target == 'preview'
        run: test "$(cat collector-exit)" != "2"

  publish:
    needs: collect
    if: github.event_name == 'schedule' || inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout publication code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Download validated collection
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: public-trust-collection
          path: evidence
      - name: Restore immutable snapshot history
        run: npm run public-trust:history -- --origin "${{ vars.TRUST_PAGES_ORIGIN }}" --output previous-pages
      - name: Stage immutable snapshot and latest pointer
        run: npm run public-trust:publish -- --snapshot evidence/snapshot.json --details evidence/details.json --previous previous-pages --output pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: pages
      - name: Deploy Pages artifact atomically
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Fail release gate after adverse evidence is public
        run: test "$(cat evidence/collector-exit)" != "2"
