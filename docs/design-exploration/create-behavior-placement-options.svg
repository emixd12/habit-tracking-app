        <rect x="0" y="0" width="22" height="22" fill="#FDFCFB" stroke="#D3D7DB"/>
        <rect x="26" y="0" width="22" height="22" fill="#FDFCFB" stroke="#D3D7DB"/>
        <rect x="52" y="0" width="22" height="22" fill="#FDFCFB" stroke="#D3D7DB"/>
        <rect x="78" y="0" width="22" height="22" fill="#FDFCFB" stroke="#D3D7DB"/>
        <rect x="104" y="0" width="22" height="22" fill="#FDFCFB" stroke="#D3D7DB"/>
        <rect x="130" y="0" width="22" height="22" fill="#FDFCFB" stroke="#D3D7DB"/>
        <rect x="156" y="0" width="22" height="22" fill="#FDFCFB" stroke="#D3D7DB"/>
        <rect x="0" y="26" width="22" height="22" fill="#F4F5F6" stroke="#D3D7DB"/>
        <rect x="26" y="26" width="22" height="22" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="52" y="26" width="22" height="22" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="78" y="26" width="22" height="22" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="104" y="26" width="22" height="22" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="130" y="26" width="22" height="22" fill="#C84A31" stroke="#D3D7DB"/>
        <rect x="156" y="26" width="22" height="22" fill="#3572B3" stroke="#D3D7DB"/>
      </g>
      <line x1="0" y1="190" x2="540" y2="190" class="line"/>
      <text x="0" y="212" class="body">Weigh and Take Body Measurements</text>
    </symbol>
    <symbol id="formMini" viewBox="0 0 360 210">
      <text x="0" y="22" class="h2">Create behavior</text>
      <text x="0" y="54" class="label">TITLE</text>
      <rect x="0" y="66" width="340" height="34" fill="#FDFCFB" stroke="#D3D7DB"/>
      <text x="12" y="88" class="small">Stretch</text>
      <text x="0" y="126" class="label">SCHEDULE</text>
      <rect x="0" y="138" width="104" height="34" fill="#3572B3"/>
      <text x="18" y="160" class="actionWhite">Daily</text>
      <rect x="112" y="138" width="104" height="34" fill="#FDFCFB" stroke="#D3D7DB"/>
      <text x="130" y="160" class="small">Weekly</text>
      <rect x="224" y="138" width="116" height="34" fill="#FDFCFB" stroke="#D3D7DB"/>
      <text x="242" y="160" class="small">Monthly</text>
      <text x="0" y="202" class="action">Save behavior</text>
    </symbol>
