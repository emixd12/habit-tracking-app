<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="2200" viewBox="0 0 1700 2200" role="img" aria-labelledby="title desc">
  <title id="title">Cadence create behavior placement options</title>
  <desc id="desc">Five interface mockups exploring placement and layout options for the Create behavior action on the Behaviors screen.</desc>
  <defs>
    <style>
      .page { fill: #FDFCFB; }
      .surface { fill: #F4F5F6; }
      .ink { fill: #0A0B0C; }
      .muted { fill: #626C75; }
      .line { stroke: #D3D7DB; stroke-width: 1; }
      .blue { fill: #3572B3; }
      .blueText { fill: #3572B3; }
      .whiteText { fill: #FDFCFB; }
      .rust { fill: #C84A31; }
      .panelTitle { font: 400 22px/1.25 Arial, Helvetica, sans-serif; fill: #0A0B0C; }
      .h1 { font: 400 28px/1.25 Arial, Helvetica, sans-serif; fill: #0A0B0C; }
      .h2 { font: 400 20px/1.25 Arial, Helvetica, sans-serif; fill: #0A0B0C; }
      .body { font: 400 14px/1.45 Arial, Helvetica, sans-serif; fill: #0A0B0C; }
      .small { font: 400 12px/1.35 Arial, Helvetica, sans-serif; fill: #626C75; }
      .label { font: 400 11px/1.2 Arial, Helvetica, sans-serif; fill: #626C75; letter-spacing: 0.8px; }
      .action { font: 400 13px/1.25 Arial, Helvetica, sans-serif; fill: #0A0B0C; text-decoration: underline; }
      .actionWhite { font: 400 13px/1.25 Arial, Helvetica, sans-serif; fill: #FDFCFB; }
      .metric { font: 400 34px/1 Arial, Helvetica, sans-serif; fill: #0A0B0C; }
      .caption { font: 400 13px/1.4 Arial, Helvetica, sans-serif; fill: #626C75; }
      .tiny { font: 400 10px/1.25 Arial, Helvetica, sans-serif; fill: #626C75; }
      .mono { font: 400 11px/1.25 Arial, Helvetica, sans-serif; fill: #626C75; }
      .shadowless { filter: none; }
    </style>
    <pattern id="heat" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#3572B3" opacity="0.92"/>
    </pattern>
    <symbol id="rail" viewBox="0 0 48 560">
      <rect width="48" height="560" fill="#FDFCFB"/>
      <line x1="47.5" y1="0" x2="47.5" y2="560" class="line"/>
      <circle cx="24" cy="28" r="10" fill="#3572B3" opacity="0.9"/>
      <rect x="17" y="84" width="14" height="14" fill="none" stroke="#0A0B0C" stroke-width="1.5"/>
      <path d="M17 132h14M17 137h14M17 142h9" stroke="#0A0B0C" stroke-width="1.5" fill="none"/>
      <path d="M17 184h14M20 181v6M28 181v6" stroke="#0A0B0C" stroke-width="1.5" fill="none"/>
      <circle cx="24" cy="232" r="7" fill="none" stroke="#0A0B0C" stroke-width="1.5"/>
    </symbol>
    <symbol id="banner" viewBox="0 0 650 28">
      <path d="M0 13C48 2 92 2 138 13S234 24 286 12 378 0 432 12 538 24 650 9" fill="none" stroke="#3572B3" stroke-opacity="0.22" stroke-width="1.5"/>
      <path d="M0 20C54 9 102 8 156 18S256 25 304 13 394 6 452 17 556 24 650 15" fill="none" stroke="#3572B3" stroke-opacity="0.18" stroke-width="1.5"/>
      <circle cx="136" cy="18" r="4" fill="#C84A31"/>
      <circle cx="322" cy="12" r="4" fill="#3572B3"/>
      <circle cx="518" cy="13" r="4" fill="#C84A31"/>
    </symbol>
    <symbol id="overall" viewBox="0 0 540 180">
      <text x="0" y="24" class="h2">Overall adherence</text>
      <text x="0" y="76" class="metric">64.7%</text>
      <text x="0" y="100" class="small">Range: Jun 1-30, 2026</text>
      <text x="0" y="135" class="small">Completed</text>
      <text x="150" y="135" class="small">112</text>
      <text x="0" y="160" class="small">Not Completed</text>
      <text x="150" y="160" class="small">61</text>
      <text x="315" y="26" class="small">7 days</text>
      <text x="370" y="26" class="ink small">30 days</text>
      <text x="440" y="26" class="small">90 days</text>
      <g transform="translate(315 50)">
        <rect x="0" y="0" width="20" height="20" fill="#FDFCFB" stroke="#D3D7DB"/>
        <rect x="26" y="0" width="20" height="20" fill="#FDFCFB" stroke="#D3D7DB"/>
        <rect x="52" y="0" width="20" height="20" fill="#FDFCFB" stroke="#D3D7DB"/>
        <rect x="78" y="0" width="20" height="20" fill="#FDFCFB" stroke="#D3D7DB"/>
        <rect x="104" y="0" width="20" height="20" fill="#FDFCFB" stroke="#D3D7DB"/>
        <rect x="130" y="0" width="20" height="20" fill="#FDFCFB" stroke="#D3D7DB"/>
        <rect x="156" y="0" width="20" height="20" fill="#FDFCFB" stroke="#D3D7DB"/>
        <rect x="0" y="26" width="20" height="20" fill="#7DA6CF" stroke="#D3D7DB"/>
        <rect x="26" y="26" width="20" height="20" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="52" y="26" width="20" height="20" fill="#7DA6CF" stroke="#D3D7DB"/>
        <rect x="78" y="26" width="20" height="20" fill="#7DA6CF" stroke="#D3D7DB"/>
        <rect x="104" y="26" width="20" height="20" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="130" y="26" width="20" height="20" fill="#AFC8E0" stroke="#D3D7DB"/>
        <rect x="156" y="26" width="20" height="20" fill="#F4F5F6" stroke="#D3D7DB"/>
        <rect x="0" y="52" width="20" height="20" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="26" y="52" width="20" height="20" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="52" y="52" width="20" height="20" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="78" y="52" width="20" height="20" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="104" y="52" width="20" height="20" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="130" y="52" width="20" height="20" fill="#AFC8E0" stroke="#D3D7DB"/>
        <rect x="156" y="52" width="20" height="20" fill="#C84A31" stroke="#D3D7DB"/>
        <rect x="0" y="78" width="20" height="20" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="26" y="78" width="20" height="20" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="52" y="78" width="20" height="20" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="78" y="78" width="20" height="20" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="104" y="78" width="20" height="20" fill="#3572B3" stroke="#D3D7DB"/>
        <rect x="130" y="78" width="20" height="20" fill="#AFC8E0" stroke="#D3D7DB"/>
        <rect x="156" y="78" width="20" height="20" fill="#F4F5F6" stroke="#D3D7DB"/>
      </g>
    </symbol>
    <symbol id="behaviorRows" viewBox="0 0 540 215">
      <text x="0" y="25" class="h2">Active behaviors</text>
      <line x1="0" y1="44" x2="540" y2="44" class="line"/>
      <text x="0" y="82" class="body">Clean Invisalign</text>
      <text x="0" y="113" class="small">Adherence</text>
      <text x="120" y="113" class="small">85.7%</text>
      <text x="0" y="138" class="small">Completed</text>
      <text x="120" y="138" class="small">18</text>
      <text x="0" y="163" class="small">Not Completed</text>
      <text x="120" y="163" class="small">3</text>
