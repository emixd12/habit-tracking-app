  <rect width="1700" height="2200" fill="#F4F5F6"/>
  <!-- Option 1 -->
  <g transform="translate(70 70)">
    <rect width="730" height="620" class="page" stroke="#D3D7DB"/>
    <text x="0" y="-18" class="panelTitle">1. Header action, inline form</text>
    <use href="#rail" x="0" y="0" width="48" height="620"/>
    <use href="#banner" x="80" y="8" width="610" height="28"/>
    <text x="112" y="86" class="h1">Behaviors</text>
    <text x="575" y="86" class="action">+ Create behavior</text>
    <line x1="112" y1="112" x2="680" y2="112" class="line"/>
    <use href="#overall" x="112" y="150" width="540" height="180"/>
    <use href="#behaviorRows" x="112" y="380" width="540" height="215"/>
  </g>

  <!-- Option 2 -->
  <g transform="translate(870 70)">
    <rect width="730" height="620" class="page" stroke="#D3D7DB"/>
    <text x="0" y="-18" class="panelTitle">2. Floating action, modal form</text>
    <use href="#rail" x="0" y="0" width="48" height="620"/>
    <use href="#banner" x="80" y="8" width="610" height="28"/>
    <text x="112" y="86" class="h1">Behaviors</text>
    <line x1="112" y1="112" x2="680" y2="112" class="line"/>
    <use href="#overall" x="112" y="150" width="540" height="180" opacity="0.55"/>
    <use href="#behaviorRows" x="112" y="380" width="540" height="215" opacity="0.55"/>
    <rect x="0" y="0" width="730" height="620" fill="#0A0B0C" opacity="0.36"/>
    <rect x="207" y="86" width="372" height="440" class="page" stroke="#D3D7DB"/>
    <text x="235" y="130" class="h2">Create behavior</text>
    <text x="548" y="130" class="body">x</text>
    <use href="#formMini" x="235" y="168" width="320" height="190"/>
    <rect x="465" y="548" width="198" height="54" class="blue"/>
    <text x="487" y="580" class="actionWhite">+ Create behavior</text>
  </g>

  <!-- Option 3 -->
  <g transform="translate(70 760)">
    <rect width="730" height="620" class="page" stroke="#D3D7DB"/>
    <text x="0" y="-18" class="panelTitle">3. Right side sheet, page remains visible</text>
    <use href="#rail" x="0" y="0" width="48" height="620"/>
    <use href="#banner" x="80" y="8" width="610" height="28"/>
    <text x="112" y="86" class="h1">Behaviors</text>
    <text x="553" y="86" class="action">Create behavior</text>
    <line x1="112" y1="112" x2="680" y2="112" class="line"/>
    <use href="#overall" x="112" y="150" width="420" height="140" opacity="0.72"/>
    <use href="#behaviorRows" x="112" y="350" width="420" height="170" opacity="0.72"/>
    <rect x="455" y="0" width="275" height="620" fill="#FDFCFB" stroke="#D3D7DB"/>
    <text x="482" y="64" class="h2">Create behavior</text>
    <text x="690" y="64" class="body">x</text>
    <text x="482" y="102" class="small">Keeps review context visible.</text>
    <text x="482" y="150" class="label">TITLE</text>
    <rect x="482" y="164" width="205" height="34" fill="#FDFCFB" stroke="#D3D7DB"/>
    <text x="494" y="186" class="small">Laundry</text>
    <text x="482" y="232" class="label">RECURRENCE</text>
    <rect x="482" y="246" width="92" height="34" class="blue"/>
    <text x="504" y="268" class="actionWhite">Daily</text>
    <rect x="582" y="246" width="105" height="34" fill="#FDFCFB" stroke="#D3D7DB"/>
    <text x="608" y="268" class="small">Weekly</text>
    <text x="482" y="326" class="label">TIME</text>
    <rect x="482" y="340" width="205" height="34" fill="#FDFCFB" stroke="#D3D7DB"/>
    <text x="494" y="362" class="small">Morning</text>
    <text x="482" y="424" class="action">Save behavior</text>
  </g>

  <!-- Option 4 -->
  <g transform="translate(870 760)">
    <rect width="730" height="620" class="page" stroke="#D3D7DB"/>
    <text x="0" y="-18" class="panelTitle">4. Active-list header action</text>
    <use href="#rail" x="0" y="0" width="48" height="620"/>
    <use href="#banner" x="80" y="8" width="610" height="28"/>
    <text x="112" y="86" class="h1">Behaviors</text>
    <line x1="112" y1="112" x2="680" y2="112" class="line"/>
    <use href="#overall" x="112" y="150" width="540" height="180"/>
    <text x="112" y="390" class="h2">Active behaviors</text>
    <text x="558" y="390" class="action">+ Create behavior</text>
    <line x1="112" y1="410" x2="680" y2="410" class="line"/>
    <text x="112" y="455" class="body">Clean Invisalign</text>
    <text x="112" y="486" class="small">Adherence</text>
    <text x="232" y="486" class="small">85.7%</text>
    <g transform="translate(462 442)">
      <rect x="0" y="0" width="22" height="22" fill="#FDFCFB" stroke="#D3D7DB"/>
      <rect x="26" y="0" width="22" height="22" fill="#3572B3" stroke="#D3D7DB"/>
      <rect x="52" y="0" width="22" height="22" fill="#3572B3" stroke="#D3D7DB"/>
      <rect x="78" y="0" width="22" height="22" fill="#3572B3" stroke="#D3D7DB"/>
      <rect x="104" y="0" width="22" height="22" fill="#C84A31" stroke="#D3D7DB"/>
    </g>
    <line x1="112" y1="535" x2="680" y2="535" class="line"/>
    <text x="112" y="570" class="body">Weigh and Take Body Measurements</text>
  </g>

  <!-- Option 5 -->
  <g transform="translate(70 1450)">
    <rect width="1530" height="620" class="page" stroke="#D3D7DB"/>
    <text x="0" y="-18" class="panelTitle">5. Compact create band, expands inline</text>
    <use href="#rail" x="0" y="0" width="48" height="620"/>
    <use href="#banner" x="90" y="8" width="1360" height="28"/>
    <text x="112" y="86" class="h1">Behaviors</text>
    <line x1="112" y1="112" x2="1450" y2="112" class="line"/>
    <rect x="112" y="142" width="1338" height="62" fill="#F4F5F6" stroke="#D3D7DB"/>
    <text x="138" y="178" class="h2">Create behavior</text>
    <text x="300" y="178" class="small">Add a recurring behavior with a schedule and reminders.</text>
    <text x="1310" y="178" class="action">Open form</text>
    <g transform="translate(112 238)">
      <use href="#overall" x="0" y="0" width="540" height="180"/>
      <g transform="translate(720 0)">
        <text x="0" y="24" class="h2">Open state preview</text>
        <line x1="0" y1="44" x2="520" y2="44" class="line"/>
        <use href="#formMini" x="0" y="72" width="360" height="210"/>
        <text x="390" y="96" class="small">Opens below the band.</text>
        <text x="390" y="132" class="small">Collapses after save.</text>
        <text x="390" y="168" class="small">Mobile stacks fields.</text>
      </g>
      <line x1="0" y1="430" x2="1338" y2="430" class="line"/>
      <text x="0" y="475" class="h2">Active behaviors</text>
      <text x="0" y="520" class="body">Clean Invisalign</text>
      <text x="0" y="552" class="small">Details and Settings</text>
